apiVersion: gpubudget.io/v1alpha1
kind: GpuBudget
metadata:
  name: demo-quota
  namespace: demo
spec:
  period: Daily
  # Deliberately tiny - the demo workload's 1 reserved GPU blows past this
  # within well under a minute of actually running, so enforcement triggers
  # on the very first reconcile for this local test.
  gpuHoursLimit: 0.01
  checkInterval: 1m
  # This mock cluster's Prometheus isn't behind ACM-hub federation, so its
  # metrics carry a plain "namespace" label rather than "exported_namespace"
  # - override the default query accordingly (see CLAUDE.md's "GPU-hours
  # accounting" section).
  query: |
    label_replace(
      sum by (product) (
        sum_over_time(
          (
            kube_pod_resource_request{resource=~"nvidia.com/.+", namespace="__NAMESPACE__"}
            * on(node) group_left(product) label_replace(kube_node_labels, "product", "$1", "label_nvidia_com_gpu_product", "(.+)")
          )[__RANGE__:5m]
        ) * (5.0/60)
      ),
      "gpuType", "$1", "product", "NVIDIA-(.+)"
    )
