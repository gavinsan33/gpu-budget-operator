apiVersion: gpubudget.io/v1alpha1
kind: GpuBudget
metadata:
  name: enforcement-kinds-demo
  namespace: enforcement-kinds-demo
spec:
  period: Daily
  # Deliberately tiny - any one workload's 1 reserved GPU blows past this
  # within about 3 minutes of actually running, so every kind in this
  # directory gets enforced on the very first reconcile.
  gpuHoursLimit: 100000.05 # 3 mins
  dollarsLimit: 12
  checkInterval: 1m
  # This mock cluster's Prometheus isn't behind ACM-hub federation, so its
  # metrics carry a plain "namespace" label rather than "exported_namespace"
  # - see samples/demo-quota.yaml / CLAUDE.md's "GPU-hours accounting".
  query: |
    label_replace(
      sum by (product) (
        sum_over_time(
          (
            kube_pod_resource_request{resource=~"nvidia.com/.+", namespace="__NAMESPACE__"}
            * on(node) group_left(product) label_replace(kube_node_labels, "product", "$1", "label_nvidia_com_gpu_product", "(.+)")
          )[__RANGE__:5m]
        ) * (5.0/60)
      ),
      "gpuType", "$1", "product", "NVIDIA-(.+)"
    )
