apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OLM-path install objects only - the CSV/CRD/ClusterRole/Deployment
# themselves come from the InstallPlan OLM generates from the bundle, not
# from anything in this repo's manager/ directories. Requires
# manager/bootstrap/namespace.yaml, manager/deploy/service-ca-configmap.yaml,
# and manager/bootstrap/monitoring_rolebinding.yaml to already be applied -
# see the Makefile's `catalog-deploy` target and README's "Install via OLM".
resources:
- catalogsource.yaml
- operatorgroup.yaml
- subscription.yaml
