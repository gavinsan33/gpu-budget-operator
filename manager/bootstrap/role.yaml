apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-budget-operator-manager-role
rules:
- apiGroups:
  - gpubudget.io
  resources:
  - gpubudgets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - gpubudget.io
  resources:
  - gpubudgets/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - gpubudget.io
  resources:
  - gpubudgets/finalizers
  verbs:
  - update
- apiGroups:
  - gpubudget.io
  resources:
  - gpubudgetoperatorconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - jobset.x-k8s.io
  resources:
  - jobsets
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - serving.kserve.io
  resources:
  - inferenceservices
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
  - delete
# configmaps/create is deliberately NOT here - EnsurePrerequisites only
# ever creates the service-ca ConfigMap in the operator's OWN namespace,
# never cluster-wide, so it's a namespace-scoped Role instead (role.yaml in
# manager/deploy/, bound only in gpu-budget-operator-system) rather than
# folded into this ClusterRole, which would grant create-any-ConfigMap
# cluster-wide - broader than what's actually used.
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  verbs:
  - create
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  resourceNames:
  - cluster-monitoring-view
  verbs:
  - bind
