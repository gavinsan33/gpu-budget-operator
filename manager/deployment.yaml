apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-quota-operator-controller-manager
  namespace: gpu-quota-operator-system
  labels:
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      serviceAccountName: gpu-quota-operator-controller-manager
      containers:
      - name: manager
        image: gpu-quota-operator:latest
        imagePullPolicy: Always
        command:
        - /manager
        args:
        - --leader-elect
        # OpenShift's built-in monitoring stack. Requires the
        # cluster-monitoring-view ClusterRoleBinding (monitoring_rolebinding.yaml).
        # TLS trust is automatic: the operator always looks for a CA bundle at
        # /etc/gpu-quota-operator/service-ca/service-ca.crt (mounted below)
        # and falls back to the system trust store if it isn't present - no
        # flag controls this. Individual GpuQuotas can override the URL
        # itself via spec.prometheusURL.
        - --default-prometheus-url=https://thanos-querier.openshift-monitoring.svc:9091
        volumeMounts:
        - name: service-ca
          mountPath: /etc/gpu-quota-operator/service-ca
          readOnly: true
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
      volumes:
      - name: service-ca
        configMap:
          name: gpu-quota-operator-service-ca
      securityContext:
        runAsNonRoot: true
