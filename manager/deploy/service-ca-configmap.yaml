# The service-ca operator injects the cluster's service-serving CA bundle
# into any ConfigMap annotated like this (populating a "service-ca.crt" key).
# The operator mounts this and always trusts it automatically (see
# metrics.NewClient) - there is no flag to skip or override this.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-quota-operator-service-ca
  namespace: gpu-quota-operator-system
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
