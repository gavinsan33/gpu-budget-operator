apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-budget-operator-controller-manager
  namespace: gpu-budget-operator-system
  labels:
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      serviceAccountName: gpu-budget-operator-controller-manager
      containers:
      - name: manager
        # Resolves to whatever build.yaml's BuildConfig most recently built
        # into this ImageStreamTag - see the Makefile's `build-image` target.
        # `oc rollout restart` after a build is required to actually pick up
        # a new image, since plain apps/v1 Deployments (unlike
        # DeploymentConfigs) have no ImageChange trigger of their own.
        image: image-registry.openshift-image-registry.svc:5000/gpu-budget-operator-system/gpu-budget-operator:latest
        imagePullPolicy: Always
        command:
        - /manager
        args:
        - --leader-elect
        # The one, cluster-wide Prometheus every GpuBudget is evaluated
        # against - there is no per-namespace override. Auth (Bearer token)
        # and TLS trust (the mounted CA bundle below, or the system trust
        # store if absent) are always automatic, with no flag to change
        # either. This default targets OpenShift's built-in monitoring
        # stack, which requires the cluster-monitoring-view
        # ClusterRoleBinding (../bootstrap/monitoring_rolebinding.yaml).
        - --prometheus-url=https://thanos-querier.openshift-monitoring.svc:9091
        # $/GPU-hour rates, only required if any GpuBudget sets spec.dollarsLimit
        # and actually uses that GPU family - REPLACE these placeholder values
        # with your real rates before relying on dollarsLimit enforcement.
        # Repeatable: add another --gpu-rate=<family>=<usd> for any GPU family
        # not listed here (e.g. B200) - no code change or rebuild required.
        - --gpu-rate=A100=1.70
        - --gpu-rate=H100=1.10
        - --gpu-rate=V100=0.30
        volumeMounts:
        - name: service-ca
          mountPath: /etc/gpu-budget-operator/service-ca
          readOnly: true
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
      volumes:
      - name: service-ca
        configMap:
          name: gpu-budget-operator-service-ca
      securityContext:
        runAsNonRoot: true
