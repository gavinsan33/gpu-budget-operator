apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-budget-operator-controller-manager
  namespace: gpu-budget-operator-system
  labels:
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      serviceAccountName: gpu-budget-operator-controller-manager
      containers:
      - name: manager
        # Resolves to whatever build.yaml's BuildConfig most recently built
        # into this ImageStreamTag - see the Makefile's `build-image` target.
        # `oc rollout restart` after a build is required to actually pick up
        # a new image, since plain apps/v1 Deployments (unlike
        # DeploymentConfigs) have no ImageChange trigger of their own.
        image: image-registry.openshift-image-registry.svc:5000/gpu-budget-operator-system/gpu-budget-operator:latest
        imagePullPolicy: Always
        command:
        - /manager
        args:
        - --leader-elect
        # The cluster-wide Prometheus URL and per-GPU-family $/GPU-hour
        # rates every GpuBudget is evaluated against are NOT flags here -
        # they come from the singleton GpuBudgetOperatorConfig (named
        # "cluster") the operator watches at runtime. Apply
        # samples/gpubudgetoperatorconfig.yaml (edited for your cluster's
        # Prometheus/rates) after deploying - see README's "Install".
        volumeMounts:
        - name: service-ca
          mountPath: /etc/gpu-budget-operator/service-ca
          readOnly: true
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
      volumes:
      - name: service-ca
        configMap:
          name: gpu-budget-operator-service-ca
      securityContext:
        runAsNonRoot: true
