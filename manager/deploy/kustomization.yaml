apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace-scoped objects a user with edit/admin rights in
# gpu-budget-operator-system (not cluster-admin) can apply repeatedly via
# `make deploy` without ever touching the cluster-scoped objects in
# ../bootstrap/.
resources:
- service_account.yaml
- service-ca-configmap.yaml
- build.yaml
- deployment.yaml
