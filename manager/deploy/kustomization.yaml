apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace-scoped objects a user with edit/admin rights in
# gpu-budget-operator-system (not cluster-admin) can apply repeatedly via
# `make deploy` without ever touching the cluster-scoped objects in
# ../bootstrap/.
#
# No service-ca-configmap.yaml here anymore - the operator creates that
# ConfigMap itself at startup (see controllers.EnsurePrerequisites);
# deployment.yaml's volume mounts it as optional so the pod still starts
# cleanly before that first-boot self-provisioning happens.
resources:
- service_account.yaml
- build.yaml
- deployment.yaml
